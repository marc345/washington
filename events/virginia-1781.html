  <header class="event-head">
    <h1>War in Virginia</h1>
    <p class="meta">January – August 1781 · The James River, the Potomac and central Virginia</p>
  </header>

  <figure class="map">
    <h2>British raids up the James, January – May</h2>
    <div class="map-canvas" id="map-raids"></div>
    <figcaption>
      In January, Arnold sailed up the James from Hampton Roads, marched from Westover into Richmond on January 5 and burned stores there and at the Westham foundry. In late April, Phillips and Arnold came upriver from Portsmouth, struck Petersburg, Chesterfield Court House and the state's small navy at Osborne's, and shelled Manchester, but Lafayette had reached Richmond just in time to hold it.
      <ol>
        <li>Petersburg, April 25: Steuben's and Muhlenberg's militia make a stand at Blandford and are pushed back.</li>
        <li>Osborne's, April 27: Arnold's guns destroy the Virginia state ships.</li>
      </ol>
      <span class="note-approx">Land routes are approximate.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>A British sloop at Mount Vernon, April 1781</h2>
    <div class="map-canvas" id="map-potomac"></div>
    <figcaption>
      HMS <i>Savage</i> worked up the Potomac, raiding riverside plantations, and anchored off Mount Vernon. Lund Washington, managing the estate, went aboard and supplied provisions to protect the house, and 17 of the enslaved people at Mount Vernon left with the ship. Washington sharply rebuked his cousin for dealing with the enemy.
      <span class="note-approx">The ship's track is schematic.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>Cornwallis chases Lafayette, May 20 – June 25</h2>
    <div class="map-canvas" id="map-chase"></div>
    <figcaption>
      With Cornwallis's arrival the British had about 7,000 men in Virginia, and the much weaker Lafayette retreated north to meet Wayne's Pennsylvanians on the Rapidan. Cornwallis sent Tarleton to raid Charlottesville, where the legislature scattered and Jefferson barely escaped, and Simcoe to the depot at Point of Fork. Reinforced, Lafayette came back south to cover the stores in Albemarle, and Cornwallis turned east toward the coast.
      <ol>
        <li>June 4–5: Tarleton's and Simcoe's raids.</li>
        <li>June 10: Lafayette and Wayne join near Raccoon Ford.</li>
      </ol>
      <span class="note-approx">Routes are approximate.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>Green Spring and the fall-back to Yorktown, June 26 – August 2</h2>
    <div class="map-canvas" id="map-greenspring"></div>
    <figcaption>
      On July 6, as Cornwallis began crossing the James at Jamestown, Wayne attacked what he took to be a rear guard and ran into the main army. A bayonet charge got his men out. Cornwallis crossed to Cobham and went on to Portsmouth, then on Clinton's orders moved by water to Yorktown and Gloucester Point, occupied on August 1–2 as a base for the fleet.
      <ol>
        <li>June 26: Simcoe's rangers and Lafayette's advance clash at Spencer's Ordinary.</li>
        <li>July 6: Green Spring. Lafayette comes forward with more Continentals to cover the withdrawal and has a horse shot under him.</li>
      </ol>
      <span class="note-approx">Positions at Green Spring and Spencer's Ordinary are approximate.</span>
    </figcaption>
  </figure>

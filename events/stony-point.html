  <header class="event-head">
    <h1>Stony Point &amp; Paulus Hook</h1>
    <p class="meta">July 15–16 and August 19, 1779 · Hudson Highlands, New York, and Paulus Hook, New Jersey</p>
  </header>

  <figure class="map">
    <h2>The Hudson Highlands, summer 1779</h2>
    <div class="map-canvas" id="map-highlands"></div>
    <figcaption>
      At the end of May Clinton came up the Hudson and took Stony Point and Verplanck's Point, closing King's Ferry, the army's main crossing below the Highlands. Washington answered by sending Wayne's light infantry on a roundabout march through the hills to storm Stony Point at night.
      <ol>
        <li>Clinton's forces seize both points, May 31 – June 1.</li>
        <li>Wayne's 1,350 men leave Sandy Beach at noon on July 15 and reach Springsteel's farm, about 1.5 miles west of the fort, by 8 p.m.</li>
        <li>West Point, the key fortress of the Highlands. Washington moves his headquarters here from New Windsor in late July.</li>
      </ol>
      <span class="note-approx">Wayne's route through the hills is approximate. Modern reservoirs and dammed lakes are omitted.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>The storming of Stony Point, midnight July 15–16</h2>
    <div class="map-canvas" id="map-assault"></div>
    <figcaption>
      Two columns with unloaded muskets went in with the bayonet from north and south while a third drew fire on the causeway in the center. The fort fell in about half an hour, with some 550 of the garrison taken prisoner.
      <ol>
        <li>Wayne's column wades the flooded marsh south of the point and climbs to the upper works. Wayne is grazed in the head.</li>
        <li>Butler's column comes in along the north shore.</li>
        <li>Murfree's North Carolinians fire from the causeway to hold the defenders' attention.</li>
      </ol>
      <span class="note-approx">The lines of abatis and the column routes are schematic.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>The raid on Paulus Hook, August 18–19</h2>
    <div class="map-canvas" id="map-paulus"></div>
    <figcaption>
      Henry Lee marched about 400 men from New Bridge through the night. A wrong turn cost three hours, so the attack went in near dawn: his men waded the ditch, took the outer works and marched off with about 150 prisoners before the British in New York could respond.
      <ol>
        <li>Lee leaves New Bridge on the afternoon of August 18.</li>
        <li>The guides lose the way; the column reaches Paulus Hook about 3:30 a.m. on August 19.</li>
        <li>The boats meant to carry them across the Hackensack at Dow's Ferry are gone, so they march back north along the ridge, met by troops sent out by Stirling.</li>
      </ol>
      <span class="note-approx">Routes are approximate. The waterfronts of Jersey City, Hoboken and lower Manhattan have been pulled back roughly to their 18th-century lines; Paulus Hook itself was a sandy rise cut off by marsh and a tidal ditch.</span>
    </figcaption>
  </figure>

  <header class="event-head">
    <h1>Howe sails for Philadelphia</h1>
    <p class="meta">July – September 1777 · New York, the Atlantic coast and the head of the Chesapeake Bay</p>
  </header>

  <figure class="map">
    <h2>The long way round: Howe's voyage and Washington's march</h2>
    <div class="map-canvas" id="map-voyage"></div>
    <figcaption>
      Howe embarked about 15,000 troops at New York and dropped out of sight at sea for weeks, leaving Washington to guess between the Hudson, Philadelphia and points south. The fleet looked into the Delaware, judged its defenses too risky, and sailed on around to the Chesapeake. Howe landed only about 55 miles from Philadelphia, a month after leaving New York.
      <ol>
        <li>Jul 23: the fleet of over 260 ships clears Sandy Hook.</li>
        <li>Jul 30–31: off Cape Henlopen, Howe turns away from the Delaware.</li>
        <li>Aug 15–25: the fleet works up the Chesapeake and lands at the head of the Elk River.</li>
        <li>Washington waits at camps north of Philadelphia, then marches through the city on Aug 24 to Wilmington.</li>
      </ol>
      <span class="note-approx">The fleet's offshore track is schematic.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>From the Elk to the Brandywine, August 25 – September 9</h2>
    <div class="map-canvas" id="map-elk"></div>
    <figcaption>
      Howe's army came ashore weak from the voyage and spent days gathering horses and wagons before advancing. Washington blocked the direct road to Philadelphia behind Red Clay Creek, but Howe marched north around his right, and the Americans fell back to the Brandywine.
      <ol>
        <li>Aug 25: the British land on Elk Neck. Knyphausen's division crosses to the east shore and comes up by a separate road.</li>
        <li>Sep 3: at Cooch's Bridge, Maxwell's light infantry skirmish with the British and Hessian advance guard, then fall back.</li>
        <li>Sep 8: Howe swings north through Newark toward Kennett Square. That night Washington moves to Chadds Ford.</li>
      </ol>
      <span class="note-approx">Landing places, Knyphausen's road and the march routes are approximate.</span>
    </figcaption>
  </figure>
</main>

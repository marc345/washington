  <header class="event-head">
    <h1>Charleston &amp; Camden</h1>
    <p class="meta">February – October 1780 · South Carolina and the North Carolina border</p>
  </header>

  <figure class="map">
    <h2>The southern campaign of 1780</h2>
    <div class="map-canvas" id="map-campaign"></div>
    <figcaption>
      After taking Charleston, the British spread a chain of posts inland. Gates marched a new southern army down from North Carolina and was routed at Camden in August. In October, backcountry militia from beyond the mountains destroyed Ferguson's Loyalists at King's Mountain.
      <ol>
        <li>Clinton's army lands south of Charleston, February 11.</li>
        <li>Tarleton overtakes Buford's Virginians at the Waxhaws, May 29.</li>
        <li>Gates takes command at the Deep River in late July and marches straight for Camden through barren pine country.</li>
        <li>The Overmountain men gather at Sycamore Shoals on September 25 and ride via Quaker Meadows, Gilbert Town and the Cowpens.</li>
      </ol>
      <span class="note-approx">Routes are approximate. Modern reservoirs (Lakes Marion, Moultrie, Murray, Wateree and others) are omitted.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>The siege of Charleston, March 29 – May 12</h2>
    <div class="map-canvas" id="map-siege"></div>
    <figcaption>
      Clinton crossed the Ashley above the town and dug his way down the Neck toward Lincoln's lines, while the fleet ran past Fort Moultrie into the harbor. Once British troops closed the country east of the Cooper, the garrison was trapped, and Lincoln surrendered about 5,500 men on May 12.
      <ol>
        <li>Clinton's army crosses the Ashley, March 29, and opens its first siege line about April 1.</li>
        <li>Arbuthnot's ships pass Fort Moultrie under fire, April 8.</li>
        <li>American ships are sunk across the mouth of the Cooper to keep the fleet out of it.</li>
        <li>After Tarleton's raid on Monck's Corner (April 14), Cornwallis's troops close the east side of the Cooper.</li>
      </ol>
      <span class="note-approx">Siege lines are schematic. The peninsula's shores have been pulled back to suggest the smaller 1780 town; much of today's waterfront is later fill. Fort Sumter's island did not exist yet.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>Camden, dawn of August 16</h2>
    <div class="map-canvas" id="map-camden"></div>
    <figcaption>
      Both armies set out on night marches along the same road and blundered into each other about 2 a.m. At dawn Cornwallis's regulars charged the militia on the American left, who fled almost at once. The Maryland and Delaware Continentals fought on until they were surrounded, and de Kalb was mortally wounded.
      <ol>
        <li>Gates marches south from Rugeley's Mill at 10 p.m.; Cornwallis marches north from Camden at the same hour.</li>
        <li>Webster's regulars break the Virginia and North Carolina militia.</li>
        <li>Tarleton's dragoons pursue the fugitives for some 20 miles up the road.</li>
      </ol>
      <span class="note-approx">The battle lines are drawn larger than scale; their positions and the course of the road are approximate. Modern ponds are omitted.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>King's Mountain, October 7</h2>
    <div class="map-canvas" id="map-km"></div>
    <figcaption>
      Ferguson camped on a narrow, wooded ridge he thought too strong to attack. About 900 mounted riflemen left their horses below, surrounded the ridge and climbed it from all sides, falling back before bayonet charges and coming on again. In about an hour Ferguson was dead and his Loyalists had surrendered.
      <ol>
        <li>Campbell and Shelby lead the first attack on the southwest end, around 3 p.m.</li>
        <li>Ferguson falls while trying to break out; his men surrender at the camp on the northeast end.</li>
      </ol>
      <span class="note-approx">The ridge outline follows modern elevation data; column positions are schematic.</span>
    </figcaption>
  </figure>

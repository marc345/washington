    <h1>Crossing the Delaware &amp; Trenton</h1>
    <p class="meta">December 25–26, 1776 · Delaware River and Trenton, New Jersey</p>
  </header>

  <figure class="map">
    <h2>The plan: three crossings, one success</h2>
    <div class="map-canvas" id="map-crossings"></div>
    <figcaption>
      Washington planned three crossings for Christmas night. Only his own column, at McConkey's Ferry nine miles above Trenton, got across. At Birmingham it split in two to come at the town from two directions.
      <ol>
        <li>Main army (about 2,400 men), crossing from about 11 p.m. to 3 a.m.</li>
        <li>Ewing's militia was to cross at Trenton Ferry and hold the Assunpink bridge, but was stopped by ice.</li>
        <li>Cadwalader was to cross near Bristol against the posts around Bordentown. Some of his men got over but were recalled.</li>
      </ol>
      <span class="note-approx">The positions of the Bristol-area crossing and the Birmingham road junction are approximate.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>The attack on Trenton, about 8 a.m., December 26</h2>
    <div class="map-canvas" id="map-attack"></div>
    <figcaption>
      Greene's column (with Washington) came in on the Pennington road, and Knox's guns at the head of King and Queen Streets swept both streets. Sullivan's column came along the River Road into the lower town and seized the Assunpink bridge.
      <ol>
        <li>Hessian outposts are driven in.</li>
        <li>Rall's and Lossberg's regiments try to form in an orchard east of town. Rall is mortally wounded, and they surrender.</li>
        <li>The Knyphausen regiment surrenders near the Assunpink. Several hundred Hessians escape over the bridge toward Bordentown before it is closed.</li>
      </ol>
      <span class="note-approx">Street lines follow the modern Warren Street (then King Street) and Broad Street (then Queen Street). Unit positions are schematic.</span>
    </figcaption>
  </figure>
</main>

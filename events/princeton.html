    <p class="meta">January 2–3, 1777 · Trenton and Princeton, New Jersey</p>
  </header>

  <figure class="map">
    <h2>January 2: Cornwallis's advance and the Assunpink line</h2>
    <div class="map-canvas" id="map-assunpink"></div>
    <figcaption>
      Cornwallis marched from Princeton with about 5,500 men, leaving brigades at Princeton and Maidenhead. Riflemen under Hand slowed him at every stream, so he reached Trenton only near dusk. The Americans held the high ground south of the Assunpink, and their artillery covered the bridge.
      <ol>
        <li>Hand's first stand at Five Mile Run, late morning.</li>
        <li>Second delay at Shabakunk Creek.</li>
        <li>Last stand at Stockton Hollow, at the edge of town, mid-afternoon.</li>
        <li>British attacks on the bridge are thrown back. Cornwallis decides to wait for morning.</li>
      </ol>
      <span class="note-approx">Positions of the American line and of the units along it are schematic. The line ran about three miles upstream to guard the fords.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>Night of January 2–3: the march around Cornwallis</h2>
    <div class="map-canvas" id="map-night"></div>
    <figcaption>
      Leaving campfires burning and a few hundred men to make noise, the army slipped east along the Sandtown road at about 1 a.m. It turned north on a back road over the Quaker Bridge and reached Stony Brook near Princeton around sunrise.
      <ol>
        <li>Rear guard keeps the fires lit, then follows before dawn.</li>
        <li>Quaker Bridge over the Assunpink.</li>
        <li>Battle of Princeton, about 8 a.m. (see next map).</li>
        <li>As Cornwallis hurries back, an American party breaks down the Stony Brook bridge to delay him.</li>
        <li>The army moves on to Kingston, then turns north up the Millstone valley toward Morristown.</li>
      </ol>
      <span class="note-approx">The night-march route follows the modern Quakerbridge and Quaker Roads, which keep the line of the 1777 byroad. Its exact course through the woods is uncertain.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>The Battle of Princeton, morning of January 3</h2>
    <div class="map-canvas" id="map-battle"></div>
    <figcaption>
      Mawhood had just set out for Trenton with the 17th Foot when he spotted the Americans and turned back to meet Mercer's brigade in William Clarke's orchard. Mercer fell mortally wounded and his men broke. Washington rode in with militia and Continental reinforcements, and the British line gave way.
      <ol>
        <li>Mercer's brigade heads for the Stony Brook bridge on the Post Road.</li>
        <li>Clash in the orchard. Mercer is mortally wounded.</li>
        <li>Washington rallies the line with Cadwalader's militia and Hitchcock's brigade. Mawhood's men break and flee back over the bridge toward Maidenhead.</li>
        <li>Sullivan's column, on the back road, drives the 40th and 55th Foot through town. Most fall back toward New Brunswick. About 200 who shelter in Nassau Hall surrender after American guns open fire.</li>
      </ol>
      <span class="note-approx">The course of the back road across the Clarke farm and the unit positions are approximate. Some recent studies suggest Mifflin, not Mercer, was sent to the bridge.</span>
    </figcaption>
  </figure>

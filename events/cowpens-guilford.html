  <header class="event-head">
    <h1>Cowpens to Guilford Courthouse</h1>
    <p class="meta">January 17 – May 20, 1781 · South Carolina, North Carolina and southern Virginia</p>
  </header>

  <figure class="map">
    <h2>Cowpens, dawn on January 17</h2>
    <div class="map-canvas" id="map-cowpens"></div>
    <figcaption>
      Morgan drew up his men in three lines across the Green River road, facing the direction Tarleton would come from. The riflemen and militia in front were asked for only a few shots each before falling back, which drew the British forward onto the Continentals waiting on the crest.
      <ol>
        <li>Skirmishers fire, then pull back to the militia line.</li>
        <li>Pickens's militia give two volleys and retire around the left of the Continental line.</li>
        <li>Howard's Continentals fall back, turn and fire, then charge. Washington's dragoons and the re-formed militia hit both British flanks, and most of Tarleton's force is killed or captured.</li>
      </ol>
      <span class="note-approx">Line positions follow the park's interpretation and are approximate; movements are schematic.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>The race to the Dan, January 17 – February 14</h2>
    <div class="map-canvas" id="map-dan"></div>
    <figcaption>
      After Cowpens, Morgan hurried northeast with his prisoners while Greene brought the main army up from its camp near Cheraw. The two joined at Guilford Courthouse and raced Cornwallis, who had burned his baggage to move faster, for the Dan. Rising rivers and a shortage of boats held the British back each time.
      <ol>
        <li>Cornwallis burns his baggage at Ramsour's Mill, then forces the Catawba at Cowan's Ford, February 1.</li>
        <li>The Americans cross the Yadkin at Trading Ford, February 2–3. The river rises behind them and sends Cornwallis upstream to the Shallow Ford.</li>
        <li>Greene's army crosses into Virginia at Irwin's and Boyd's ferries, February 13–14, just ahead of the British.</li>
      </ol>
      <span class="note-approx">Routes are simplified from period accounts and are approximate. The modern reservoirs on these rivers are not shown.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>Guilford Courthouse, March 15</h2>
    <div class="map-canvas" id="map-guilford"></div>
    <figcaption>
      Reinforced, Greene recrossed the Dan in late February and offered battle at Guilford Courthouse, copying Morgan's layout of three lines. Cornwallis attacked up the New Garden road from the west and drove through all three, but lost about a quarter of his army doing it.
      <ol>
        <li>First line: North Carolina militia behind a rail fence at the edge of the woods fire one or two volleys and break.</li>
        <li>Second line: Virginia militia in the woods hold longer, while a separate fight with Lee and Campbell drifts off to the south.</li>
        <li>Third line: the Continentals near the courthouse. Cornwallis fires grapeshot into the melee, then Greene withdraws in good order toward Troublesome Creek.</li>
      </ol>
      <span class="note-approx">Positions are approximate and drawn schematically.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>Cornwallis goes to Wilmington, then Virginia, March 18 – May 20</h2>
    <div class="map-canvas" id="map-wilmington"></div>
    <figcaption>
      Too weak to stay inland, Cornwallis marched down the Cape Fear River to refit at Wilmington. Greene followed as far as Ramsey's Mill, then turned south into South Carolina. On April 25 Cornwallis left Wilmington and marched north, reaching Petersburg on May 20 to take over the British force already raiding Virginia.
      <span class="note-approx">Routes are approximate.</span>
    </figcaption>
  </figure>

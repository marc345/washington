  </header>

  <figure class="map">
    <h2>Charleston harbor, June 1776</h2>
    <div class="map-canvas" id="map-harbor"></div>
    <figcaption>
      Sir Peter Parker's squadron worked its ships over the bar into Five Fathom Hole in early June, while Clinton landed his troops on Long Island, northeast of Sullivan's Island. The unfinished palmetto-log fort covered the main channel into the harbor.
      <ol>
        <li>The fleet crosses the bar, June 7–10, and waits in Five Fathom Hole for a favorable wind.</li>
        <li>About 2,200 British troops land on Long Island (today's Isle of Palms) from June 9.</li>
        <li>Charles Lee keeps a post at Haddrell's Point and tries to bridge the Cove with boats as an escape route for the fort.</li>
      </ol>
      <span class="note-approx">The bar, the anchorage and the shoals are placed approximately. Fort Sumter's island did not exist yet and is omitted; Morris Island has been widened to suggest its larger 18th-century extent.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>The bombardment, June 28</h2>
    <div class="map-canvas" id="map-fort"></div>
    <figcaption>
      Four warships anchored a few hundred yards off the fort and fired from late morning until dark; the spongy palmetto logs and sand absorbed the shot. Three frigates sent around to fire into the fort's open rear ran aground on the Middle Ground shoal.
      <ol>
        <li>Moultrie's garrison, about 435 men, answers slowly to save powder.</li>
        <li><i>Sphinx</i>, <i>Syren</i> and <i>Actaeon</i> go aground; <i>Actaeon</i> is stuck and burned by her crew the next morning.</li>
        <li>At Breach Inlet, Thomson's riflemen and a few guns stop Clinton's troops, who find the inlet too deep to wade and their boats exposed to fire.</li>
      </ol>
      <span class="note-approx">Ship positions are schematic. The island's channel shore has been pulled back toward the fort; sand has built up there since the 1800s.</span>
    </figcaption>
  </figure>

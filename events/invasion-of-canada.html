<main>
  <header class="event-head">
    <h1>Invasion of Canada</h1>
    <p class="meta">September 1775 – October 1776 · Maine, the St. Lawrence valley and Lake Champlain</p>
  </header>

  <figure class="map">
    <h2>Autumn 1775: two roads to Quebec</h2>
    <div class="map-canvas" id="map-routes"></div>
    <figcaption>
      Montgomery went north by the Lake Champlain–Richelieu waterway toward Montreal. Arnold took about 1,100 men up the Kennebec and over the mountains to strike Quebec from the south. Only about 600 of them got there.
      <ol>
        <li>Sep 25 – Oct 9: Arnold's bateaux work up the Kennebec from Fort Western past Norridgewock Falls.</li>
        <li>Oct 11–16: the Great Carrying Place, a 12-mile portage by way of three ponds to the Dead River.</li>
        <li>Oct 21–25: a flood swamps the Dead River camps. Enos's rear division turns back with much of the food.</li>
        <li>Oct 26 – Nov 3: over the Height of Land to Lake Megantic, then down the Chaudière rapids to the first French farms at Sartigan.</li>
        <li>Nov 13–14: Arnold crosses the St. Lawrence by night from Pointe-Lévis to Wolfe's Cove.</li>
        <li>Sep 17 – Nov 3: siege of St. Johns. Chambly falls on Oct 18, and St. Johns surrenders two weeks later.</li>
        <li>Nov 13: Montgomery enters Montreal. Carleton slips downriver to Quebec.</li>
        <li>Dec 2–3: Montgomery joins Arnold at Pointe-aux-Trembles, and they close in on Quebec together.</li>
      </ol>
      <span class="note-approx">Routes are drawn at campaign scale and follow the rivers only roughly. The portage and Height of Land legs are approximate.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>The assault on Quebec, before dawn, December 31, 1775</h2>
    <div class="map-canvas" id="map-quebec"></div>
    <figcaption>
      In a snowstorm, two columns struck the Lower Town from opposite ends while feints held the walled Upper Town's garrison in place. The plan was to meet in the Lower Town and climb into the upper city together.
      <ol>
        <li>Feints: Brown at the Cape Diamond bastion and Livingston's Canadians at St. John's Gate. Signal rockets go up at about 4 a.m.</li>
        <li>Montgomery leads his column along the narrow shore path under Cape Diamond. Grapeshot from the blockhouse at Près-de-Ville kills him, and his column falls back.</li>
        <li>Arnold's column passes under the walls by the St. Charles shore. He is wounded at the first barricade, and Morgan takes it.</li>
        <li>Morgan's men are stopped at the second barricade in Sault-au-Matelot street.</li>
        <li>Troops sent out of Palace Gate retake the first barricade behind them. Morgan's party, more than 400 men, is trapped and surrenders by about 10 a.m.</li>
      </ol>
      <span class="note-approx">Shorelines are reconstructed by hand: the Lower Town waterfront, Pointe-à-Carcy and the St. Charles flats are later landfill. The wall trace follows the surviving fortifications, and the barricade sites are approximate.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>May – October 1776: retreat up the Richelieu and the fight for the lake</h2>
    <div class="map-canvas" id="map-retreat"></div>
    <figcaption>
      British reinforcements reached Quebec on May 6, and the American siege army, weakened by smallpox, fled upriver. By early July the survivors were back at Crown Point and Ticonderoga. Both sides then built fleets to control Lake Champlain.
      <ol>
        <li>May 6: the siege is abandoned in haste.</li>
        <li>May 19–20: the American post at the Cedars, west of Montreal, surrenders.</li>
        <li>Jun 8: an American counterattack at Trois-Rivières is routed.</li>
        <li>Jun 15–18: Arnold leaves Montreal, and St. Johns and Chambly are abandoned and burned. The army rests at the fever-ridden Île aux Noix, then goes on up the lake.</li>
        <li>Oct 11–13: Carleton's new fleet sails south from St. Johns and catches Arnold's flotilla at Valcour Island (see next map).</li>
      </ol>
      <span class="note-approx">Retreat routes are schematic.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>Valcour Island, October 11–12, 1776</h2>
    <div class="map-canvas" id="map-valcour"></div>
    <figcaption>
      Arnold anchored his 15 vessels in a line across the channel behind Valcour Island. The British fleet sailed past the island with the wind behind it and had to beat back up into the wind to attack. The fight lasted from late morning until dark.
      <ol>
        <li>The schooner <i>Royal Savage</i> runs aground on the island and is burned. The gondola <i>Philadelphia</i> sinks that evening.</li>
        <li>The British line closes the southern exit, with Indian allies firing from the island and the shore.</li>
        <li>On the night of the 11th the Americans slip past the British line in fog, in single file close to the western shore.</li>
        <li>Oct 13: overtaken near Split Rock, Arnold runs his last boats aground at Ferris Bay, about 30 miles south, and burns them. He then marches his men to Crown Point.</li>
      </ol>
      <span class="note-approx">Ship positions are schematic. Lake levels are modern but close to those of 1776.</span>
    </figcaption>
  </figure>

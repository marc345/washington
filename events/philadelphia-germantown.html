  <header class="event-head">
    <h1>Fall of Philadelphia &amp; Germantown</h1>
    <p class="meta">September 12 – October 4, 1777 · Schuylkill Valley, Philadelphia and Germantown, Pennsylvania</p>
  </header>

  <figure class="map">
    <h2>Maneuvers along the Schuylkill, September 12–26</h2>
    <div class="map-canvas" id="map-schuylkill"></div>
    <figcaption>
      After Brandywine, Washington recrossed the Schuylkill to stay between Howe and Philadelphia and the supply depots up the valley. A storm ended the one chance of battle, and Howe then drew him upriver with a feint before crossing below him and walking into the capital.
      <ol>
        <li>Sep 12–13: the army retreats through Chester and Darby, crosses the Schuylkill at Philadelphia, and rests at Germantown.</li>
        <li>Sep 16: the armies meet near the White Horse Tavern, but a downpour soaks the cartridges (the "Battle of the Clouds"). Washington falls back to Yellow Springs and Reading Furnace to replace ammunition.</li>
        <li>Night of Sep 20–21: Grey's bayonet attack surprises Wayne's division camped near Paoli.</li>
        <li>Sep 21–23: Howe feints toward Reading. Washington shifts upriver to cover it, and the British cross at Fatland and Gordon's fords behind him.</li>
        <li>Sep 26: Cornwallis marches into Philadelphia; Howe's main body camps at Germantown.</li>
      </ol>
      <span class="note-approx">Routes are simplified, and camp sites are approximate.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>Philadelphia occupied, September 26–27</h2>
    <div class="map-canvas" id="map-occupation"></div>
    <figcaption>
      The city then filled only the blocks nearest the Delaware; the grid between there and the Schuylkill was mostly fields. Howe kept the bulk of his army in camp at Germantown, about six miles north, and sent Cornwallis's grenadiers to take over the city.
      <ol>
        <li>Sep 26: Cornwallis enters by the Germantown Road and Second Street.</li>
        <li>Sep 27: American warships attack the new British batteries on the waterfront. The frigate <i>Delaware</i> runs aground and is captured.</li>
      </ol>
      <span class="note-approx">The waterfront is drawn at its 1777 line, before Delaware Avenue and the piers were built on fill. Windmill Island, later dredged away, is restored. The built-up area is approximate.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>Germantown, dawn, October 4</h2>
    <div class="map-canvas" id="map-attack"></div>
    <figcaption>
      Washington marched all night from Methacton Hill in four columns, timed to strike Howe's camp at Germantown together at dawn. The two Continental columns came down the center while militia columns were to turn both British flanks. In thick fog the attack lost its timing and its way.
      <ol>
        <li>Sullivan's column overruns the British light infantry at Mount Airy.</li>
        <li>About 120 men of the 40th Foot barricade themselves in the Chew house (Cliveden). The reserve stops to besiege it and loses precious time.</li>
        <li>Part of Greene's column, drawn by the firing at Cliveden, runs into Wayne's men in the fog, and both fall back.</li>
        <li>Greene's left pushes into the British camp near Market Square but is driven out as Cornwallis arrives from the city. The militia columns achieve little.</li>
      </ol>
      <span class="note-approx">Column routes follow the period roads; unit positions are schematic.</span>
    </figcaption>
  </figure>

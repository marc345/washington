    <p class="meta">November 16–20, 1776 · Northern Manhattan and the Palisades, New Jersey</p>
  </header>

  <figure class="map">
    <h2>November 16: four attacks on Fort Washington</h2>
    <div class="map-canvas" id="map-assault"></div>
    <figcaption>
      Howe attacked the fort's outer defenses from three sides at once. By early afternoon the defenders had been driven from the outworks into the crowded fort, and Magaw surrendered about 2,800 men. That morning Washington, Greene, Putnam and Mercer had crossed from Fort Lee to the Morris house, leaving shortly before the British arrived there.
      <ol>
        <li>Knyphausen's Hessians climb the steep wooded slopes north of the fort against Rawlings's riflemen.</li>
        <li>Guards and light infantry under Mathew, followed by Cornwallis, row across the Harlem River and take Laurel Hill.</li>
        <li>The 42nd Highlanders land lower down the Harlem and climb toward the rear of the southern lines.</li>
        <li>Percy advances from the south against Cadwalader, who falls back to the fort.</li>
      </ol>
      <span class="note-approx">The outworks, lines and attack routes are approximate.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>November 20: Fort Lee abandoned</h2>
    <div class="map-canvas" id="map-fort-lee"></div>
    <figcaption>
      Four days later Cornwallis crossed the Hudson by night with about 5,000 men, landed below the Palisades at Lower Closter Landing and climbed a steep path to the top. Warned in time, Washington led the Fort Lee garrison west to the bridge over the Hackensack, leaving behind tents, cannon and stores.<br>
      <span class="note-approx">The crossing point, the British route south and the garrison's road west are approximate.</span>
    </figcaption>
  </figure>
</main>

function nyPasses(list) {
  return ({ root, P, u }) => list.forEach(p => {
    const c = P(p.coords);
    root.append('path').attr('d', 'M-7,-7 Q-2,0 -7,7 M7,-7 Q2,0 7,7')
      .attr('transform', `translate(${c[0]},${c[1]}) rotate(${p.angle || 0}) scale(${u})`)

  });
}

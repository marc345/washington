    <h1>Siege of Yorktown</h1>
    <p class="meta">September 28 – October 19, 1781 · Yorktown and Gloucester Point, Virginia</p>
  </header>

  <figure class="map">
    <h2>Closing the trap, September 28 – October 17</h2>
    <div class="map-canvas" id="map-theater"></div>
    <figcaption>
      The allies marched from Williamsburg on September 28 and closed around Yorktown, the French on the left and the Americans on the right. Across the river, a smaller allied force sealed off the British post at Gloucester Point, and French warships held the mouth of the York.
      <ol>
        <li>Cornwallis gives up his outer works on the night of September 29–30 and falls back to the town lines.</li>
        <li>October 3: Tarleton's foragers clash with Lauzun's legion near the Hook and are driven back inside the Gloucester lines.</li>
        <li>Night of October 16–17: Cornwallis tries to ferry his army across to Gloucester. A squall scatters the boats after the first trip.</li>
      </ol>
      <span class="note-approx">Camp areas, march routes and the Gloucester positions are approximate.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>The siege lines, October 6–14</h2>
    <div class="map-canvas" id="map-lines"></div>
    <figcaption>
      Allied sappers opened the first parallel on the night of October 6, about 600 to 800 yards from the British works, and the guns opened fire on October 9. A second parallel, roughly halfway closer, was begun on October 11 but could not reach the river until two British redoubts near the bank were taken.
      <span class="note-approx">Trench lines are traced from period maps and the surviving earthworks, simplified.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>The storming of Redoubts 9 and 10, evening of October 14</h2>
    <div class="map-canvas" id="map-redoubts"></div>
    <figcaption>
      After dark, two columns of about 400 men each went in with the bayonet. Hamilton's American light infantry took Redoubt 10 (about 70 defenders) in minutes. The French under the Comte de Deux-Ponts took the larger Redoubt 9 (about 120 British and German defenders) at a heavier cost. That night both redoubts were joined to the second parallel. A French feint against the Fusiliers' Redoubt, on the far side of town, drew attention away.
      <span class="note-approx">Attack routes are schematic.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>The surrender, October 19</h2>
    <div class="map-canvas" id="map-surrender"></div>
    <figcaption>
      Terms were drafted at the Moore House on October 18. On the afternoon of the 19th the garrison marched out along the Hampton road between the lined-up allied armies, the French on one side and the Americans on the other, and laid down its arms in a field to the south. The Gloucester garrison surrendered the same day.
      <span class="note-approx">The positions of the allied ranks are schematic.</span>
    </figcaption>
  </figure>

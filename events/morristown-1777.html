  <figure class="map">
    <h2>Between New York and Philadelphia: the winter positions and the forage war</h2>
    <div class="map-canvas" id="map-region"></div>
    <figcaption>
      After Princeton the army marched north to Morristown, arriving January 6. The British pulled back to a narrow strip along the Raritan between New Brunswick and Perth Amboy. Any British march on Philadelphia had to use the post road, within a day's reach of Morristown. All winter American outposts and militia attacked the parties the British sent out for forage and firewood.
      <ol>
        <li>Route from Princeton by Somerset Court House and Pluckemin, January 3–6.</li>
        <li>Millstone, January 20: New Jersey militia under Dickinson drive off a large British foraging party.</li>
        <li>Quibbletown and Drake's farm, February–March: repeated clashes with foragers out of New Brunswick.</li>
        <li>Spanktown (Rahway), February 23: a British column is mauled on its way back to Perth Amboy.</li>
        <li>Bound Brook, April 13: Cornwallis surprises Lincoln's outpost, but most of the garrison escapes.</li>
      </ol>
      <span class="note-approx">The British zone and the outpost positions are approximate. Only a few of the many winter skirmishes are shown.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>Morristown behind the Watchung ridges</h2>
    <div class="map-canvas" id="map-ridges"></div>
    <figcaption>
      Two long ridges, the Watchung Mountains, and the Great Swamp lay between Morristown and the British posts. The few roads through the gaps could be watched from outposts, and the ridge top gave views over the plain toward New Brunswick and New York. In late May the army moved forward to the Middlebrook valley, behind the first ridge.
      <ol>
        <li>Washington's headquarters at Arnold's tavern on the Green. The troops were quartered in and around town and in the Loantaka valley.</li>
        <li>Fort Nonsense, an earthwork on the hill above town, begun in spring 1777.</li>
        <li>Middlebrook camp from May 28, overlooking the plain and the road from New Brunswick.</li>
      </ol>
      <span class="note-approx">Ridge crests and camp areas are drawn from the terrain data. Camp outlines are schematic.</span>
    </figcaption>
  </figure>

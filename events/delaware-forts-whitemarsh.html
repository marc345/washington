    <p class="meta">October – December 1777 · Delaware River below Philadelphia, and Whitemarsh, Pennsylvania</p>
  </header>

  <figure class="map">
    <h2>The river barrier below Philadelphia</h2>
    <div class="map-canvas" id="map-river"></div>
    <figcaption>
      Holding Philadelphia meant nothing to Howe unless his fleet could reach it. Sunken frames of timber tipped with iron (chevaux-de-frise) blocked the channel at Billingsport and again under the guns of Fort Mifflin and Fort Mercer, backed by the galleys of the Pennsylvania Navy.
      <ol>
        <li>Oct 2: a British force crosses from Chester and takes the unfinished fort at Billingsport; the lower barrier is gradually cleared.</li>
        <li>Oct 22: Donop's Hessians march down from Cooper's Ferry and assault Fort Mercer at Red Bank.</li>
        <li>Nov 18–21: Cornwallis crosses from Chester to Billingsport; Fort Mercer is abandoned before he arrives, and the Pennsylvania galleys slip upriver past the city on the night of Nov 19–20, and the remaining Continental vessels are burned on Nov 21.</li>
      </ol>
      <span class="note-approx">Shoreline adjusted to the period: the marsh islands below the Schuylkill mouth, now joined to the mainland under the airport and Navy Yard, are shown as islands, and the Philadelphia and Camden waterfronts are pulled back to about their 1777 lines. Island outlines and barrier positions are approximate.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>Fort Mifflin and Red Bank, October 22 – November 15</h2>
    <div class="map-canvas" id="map-mifflin"></div>
    <figcaption>
      Fort Mifflin on Mud Island and Fort Mercer on the New Jersey bluff covered the barrier from both banks. Donop's assault on Fort Mercer failed with heavy loss, but British batteries on the marsh islands and warships pounded Fort Mifflin for weeks.
      <ol>
        <li>Oct 22: Donop's columns attack the north and south sides of Fort Mercer, while American galleys fire into their flank. Donop is mortally wounded.</li>
        <li>Oct 23: the ship of the line <i>Augusta</i> and the sloop <i>Merlin</i>, aground below the barrier, burn and blow up.</li>
        <li>Nov 15: the floating battery <i>Vigilant</i> is worked up the back channel to point-blank range. That night the garrison crosses to Red Bank.</li>
      </ol>
      <span class="note-approx">Island outlines, channel widths, battery and ship positions are approximate, after period British surveys.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>Whitemarsh to Valley Forge, December 4–19</h2>
    <div class="map-canvas" id="map-whitemarsh"></div>
    <figcaption>
      Howe marched out of Philadelphia to fight the army in its hill camp at Whitemarsh, probed its left and right for three days, and returned without attacking. Days later the army crossed the Schuylkill and went into winter quarters at Valley Forge.
      <ol>
        <li>Dec 5: Howe reaches Chestnut Hill; Pennsylvania militia are driven back and their general, James Irvine, is captured.</li>
        <li>Dec 7: fighting at Edge Hill with Morgan's riflemen and Maryland militia.</li>
        <li>Dec 11: crossing at Matson's Ford runs into a large British foraging force. The army crosses at Swede's Ford instead and camps at Gulph Mills until Dec 19.</li>
      </ol>
      <span class="note-approx">Camp lines and routes are approximate.</span>
    </figcaption>
  </figure>

// Builds a water ring along a centreline (a narrow channel), half-width in degrees of latitude.
function band(pts, h) {
  const k = Math.cos(39.9 * Math.PI / 180), L = [], R = [];
  pts.forEach((p, i) => {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    const dx = (b[0] - a[0]) * k, dy = b[1] - a[1], n = Math.hypot(dx, dy);
    const nx = -dy / n, ny = dx / n;
    L.push([p[0] + nx * h / k, p[1] + ny * h]); R.push([p[0] - nx * h / k, p[1] - ny * h]);
  });
  return L.concat(R.reverse());
}
// d3-geo treats a ring wound the wrong way as "everything except this ring": normalise winding.

  return area > 2 * Math.PI ? r.slice().reverse() : r;

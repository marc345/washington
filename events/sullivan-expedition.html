  <header class="event-head">
    <h1>Sullivan–Clinton expedition</h1>
    <p class="meta">June – October 1779 · Pennsylvania frontier and Iroquois country, western New York</p>
  </header>

  <figure class="map">
    <h2>Two columns converge on Tioga</h2>
    <div class="map-canvas" id="map-overview"></div>
    <figcaption>
      Washington's plan sent Sullivan's main army up the Susquehanna from Pennsylvania while James Clinton's brigade came down the river from the Mohawk valley. Joined at Tioga, the combined force of about 4,000 men marched into Seneca country.
      <ol>
        <li>Jun 18–23: Sullivan cuts a road across the Pocono uplands from Easton to the Wyoming valley, which had been raided the year before. Supply delays hold him there until July 31.</li>
        <li>Aug 9: Clinton's men break a dam they had built at the outlet of Otsego Lake. The release of water floats their 200 boats down the shallow upper Susquehanna.</li>
        <li>Aug 22: the two columns meet at Tioga, where the Chemung joins the Susquehanna.</li>
        <li>Aug 29: Newtown, the campaign's only pitched battle (next map).</li>
        <li>September: towns, orchards and crops are destroyed from Seneca Lake to the Genesee River (third map). Retreating Loyalists and Iroquois fall back to Fort Niagara.</li>
      </ol>
      <span class="note-approx">Routes are drawn at campaign scale. A third column under Brodhead marched up the Allegheny from Fort Pitt, west of this map.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>August 29: Newtown</h2>
    <div class="map-canvas" id="map-newtown"></div>
    <figcaption>
      About 600 Loyalist rangers and Iroquois under John Butler and Joseph Brant waited behind a hidden log breastwork on the slope above the trail. Sullivan's riflemen spotted it, and he planned to pin the defenders in front while two brigades worked around behind the hill.
      <ol>
        <li>Hand's light infantry takes cover along Baldwin Creek, facing the breastwork. The artillery opens fire in mid-afternoon.</li>
        <li>Poor's and Clinton's brigades go up the swampy hollow to climb the hill from the northeast. The marsh slows them down.</li>
        <li>Ogden's regiment moves along the river against the defenders' other flank.</li>
        <li>As Poor's men reach the crest, the defenders slip away along the ridge toward Newtown before the trap closes.</li>
      </ol>
      <span class="note-approx">The breastwork and troop positions are approximate. The river follows its modern course.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>September 1779: the burning of the Seneca and Cayuga towns</h2>
    <div class="map-canvas" id="map-lakes"></div>
    <figcaption>
      The army met little resistance after Newtown. It burned some forty towns, with their houses, orchards and stored corn, then turned back from the Genesee in mid-September. Detachments swept both shores of Cayuga Lake on the way home.
      <ol>
        <li>Sep 1–2: Catharine's Town, at the head of Seneca Lake.</li>
        <li>Sep 7: Kanadaseaga, the chief Seneca town.</li>
        <li>Sep 13: a scouting party under Lt. Thomas Boyd is ambushed near Conesus Lake. Boyd and Sgt. Michael Parker are captured and killed.</li>
        <li>Sep 14–15: Genesee Castle (Little Beard's Town), the largest town, is destroyed. The army turns back.</li>
        <li>Sep 20–28: Butler's detachment burns the Cayuga towns on the east shore, and Dearborn's the west shore. Both rejoin the army near Tioga, and it reaches Easton on Oct 15.</li>
      </ol>
      <span class="note-approx">Town sites and routes are approximate. Only the main towns are shown.</span>
    </figcaption>
  </figure>

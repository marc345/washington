<main>
  <header class="event-head">
    <h1>The march to Yorktown</h1>
    <p class="meta">August 19 – September 28, 1781 · From the Hudson to Williamsburg, Virginia</p>
  </header>

  <figure class="map">
    <h2>Leaving New York, and the Staten Island feint, August 19–30</h2>
    <div class="map-canvas" id="map-hudson"></div>
    <figcaption>
      The allied armies slipped away from their camps around Philipsburg, crossed the Hudson at King's Ferry and marched south through New Jersey in three parallel columns. Their route, with boats carried on wagons and bread ovens built at Chatham, made Clinton expect an attack on Staten Island and New York. Only on August 29–30 did the columns turn southwest, away from the city.
      <ol>
        <li>The Americans cross at King's Ferry on August 20–22, the French on August 23–25.</li>
        <li>Washington's headquarters at Chatham, August 27–28, where the ovens were built.</li>
      </ol>
      <span class="note-approx">The two American column routes are approximate.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>To the head of the Chesapeake and down the bay, August 30 – September 26</h2>
    <div class="map-canvas" id="map-route"></div>
    <figcaption>
      The armies paraded through Philadelphia on September 2–4. At Chester on September 5 Washington learned that de Grasse had reached the Chesapeake. There were too few vessels at Head of Elk, so part of the force sailed from there and the rest marched on to embark at Baltimore and Annapolis. Washington rode ahead, stopping at Mount Vernon (September 9–12) for the first time in six years, and reached Williamsburg on September 14.
      <span class="note-approx">The water route down the bay and Washington's ride are approximate.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>Two French fleets converge, August 5 – September 10</h2>
    <div class="map-canvas" id="map-fleets"></div>
    <figcaption>
      De Grasse sailed from Cap-Français in Saint-Domingue on August 5 with 28 ships of the line and some 3,000 soldiers, and anchored inside the Virginia Capes on August 30. De Barras left Newport on August 25 with the siege artillery, swinging far out to sea to avoid the British. Hood, following from the West Indies, looked into the empty Chesapeake on August 25 and sailed on to New York to join Graves.
      <span class="note-approx">Tracks at sea are schematic.</span>
    </figcaption>
  </figure>

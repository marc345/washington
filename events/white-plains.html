    <p class="meta">October 12 – November 5, 1776 · Westchester County, New York</p>
  </header>

  <figure class="map">
    <h2>October 12 – November 5: the race up Westchester</h2>
    <div class="map-canvas" id="map-westchester"></div>
    <figcaption>
      Howe moved by water through Hell Gate to land behind the American army. Washington left a garrison in Fort Washington and marched the rest north along the hills west of the Bronx River, reaching White Plains ahead of the British.
      <ol>
        <li>October 12: the British land on Throg's Neck, which was nearly an island at high tide. A few Pennsylvania riflemen hold the causeway and bridge at Westchester Creek.</li>
        <li>October 18: Howe lands again at Pell's Point. Glover's brigade fights a delaying action behind stone walls.</li>
        <li>October 22: an American raid on the Queen's Rangers' camp at Mamaroneck.</li>
        <li>After the battle Washington falls back to the heights of North Castle, and Howe turns west toward Dobbs Ferry and Fort Washington.</li>
      </ol>
      <span class="note-approx">Routes and dates of the marches are approximate. Shoreline changes in the Bronx (Orchard Beach, LaGuardia) are corrected, smaller ones are not.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>October 28: Chatterton's Hill</h2>
    <div class="map-canvas" id="map-chatterton"></div>
    <figcaption>
      Howe found the main American lines too strong and struck instead at Chatterton's Hill, across the Bronx River on the American right, held by about 1,600 men under McDougall. British regiments waded the river and climbed the eastern slope while Rall's Hessians swung around the south end of the hill, where the militia broke. McDougall withdrew to the main lines in good order.
      <ol>
        <li>Morning: Spencer's advance party skirmishes and falls back across the river.</li>
        <li>British guns on the hills east of the river cover the crossing.</li>
        <li>Militia on the American right give way under Rall's attack and a cavalry threat.</li>
      </ol>
      <span class="note-approx">The line of the American main works and all unit positions are approximate.</span>
    </figcaption>
  </figure>

function nyPasses(list) {
  return ({ root, P, u }) => list.forEach(p => {
    const c = P(p.coords);
    root.append('path').attr('d', 'M-7,-7 Q-2,0 -7,7 M7,-7 Q2,0 7,7')

  });
}

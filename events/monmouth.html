    <h1>Monmouth campaign</h1>
    <p class="meta">June 18–28, 1778 · Philadelphia to Monmouth Court House (Freehold), New Jersey</p>
  </header>

  <figure class="map">
    <h2>Clinton's march across New Jersey and Washington's pursuit</h2>
    <div class="map-canvas" id="map-campaign"></div>
    <figcaption>
      Clinton left Philadelphia on June 18 with well over 10,000 troops (estimates vary widely) and a baggage train some twelve miles long. Washington left Valley Forge the next day, crossed the Delaware above Trenton, and closed in from the north while militia and Maxwell's brigade broke bridges and felled trees in Clinton's path.
      <ol>
        <li>The British cross the Delaware to Gloucester and gather at Haddonfield.</li>
        <li>At Allentown, Clinton turns east toward Sandy Hook rather than risk the Raritan crossings.</li>
        <li>The Americans cross at Coryell's Ferry, June 20–22. Council of war at Hopewell, June 24.</li>
        <li>Lee's advance force waits at Englishtown on June 27, six miles from the British camp.</li>
        <li>After the battle Clinton reaches Sandy Hook, and the fleet carries the army to New York in early July.</li>
      </ol>
      <span class="note-approx">Routes are drawn along the main period roads and are approximate in detail.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>June 28, morning: Lee's attack and retreat</h2>
    <div class="map-canvas" id="map-morning"></div>
    <figcaption>
      Lee's advance force of about 4,500 men moved out of Englishtown to strike the British rear guard as it left Monmouth Court House. Clinton turned back with his best troops. Lee's units, some withdrawing without orders, fell back across the ravines toward the main army.
      <ol>
        <li>The British main column and baggage set out for Middletown before dawn.</li>
        <li>Wayne engages the British rear guard north of the court house while Lee tries to swing around its flank, about 10 a.m.</li>
        <li>British grenadiers, guards and dragoons counterattack. Lee's line comes apart.</li>
        <li>Washington meets the retreating Lee near the bridge, shortly before 1 p.m., and takes command.</li>
      </ol>
      <span class="note-approx">Unit positions and routes in the morning fighting are approximate and much simplified. Stream names are modern.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>June 28, afternoon: Washington's line at Perrine's Hill</h2>
    <div class="map-canvas" id="map-afternoon"></div>
    <figcaption>
      Washington formed the main army on Perrine's Hill behind the marshy Middle Brook. British attacks across the bridge and around the left were beaten off, followed by a long artillery duel in heat near 100°F. That night Clinton slipped away toward Middletown.
      <ol>
        <li>Stirling's wing on the left repels the British light infantry and the 42nd.</li>
        <li>Wayne holds the hedgerow and later fights the grenadiers near the parsonage.</li>
        <li>Greene's guns on Combs Hill fire into the British flank in the mid-afternoon, ending the duel.</li>
        <li>Lafayette commands the second line behind the hill.</li>
      </ol>
      <span class="note-approx">Positions are schematic. The hedgerow, parsonage and Combs Hill locations follow the state battlefield park.</span>
    </figcaption>
  </figure>

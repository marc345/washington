    <h1>Brandywine</h1>
    <p class="meta">September 11, 1777 · Brandywine Creek, Chester County, Pennsylvania</p>
  </header>

  <figure class="map">
    <h2>Morning: the fords and Howe's flank march</h2>
    <div class="map-canvas" id="map-flank"></div>
    <figcaption>
      Washington guarded the fords of the Brandywine on either side of Chadds Ford, where the Great Road to Philadelphia crossed. Howe repeated his Long Island plan: Knyphausen's division held the Americans' attention at the ford while Howe and Cornwallis marched about 17 miles around their right, crossing both branches of the creek above the forks.
      <ol>
        <li>From about 5:30 a.m., Knyphausen pushes Maxwell's light infantry back along the Great Road to the creek.</li>
        <li>Howe and Cornwallis cross Trimble's Ford on the West Branch and Jefferis Ford on the East Branch, both unguarded.</li>
        <li>About 2 p.m., the column halts on Osborne's Hill, behind the American right. Conflicting scouting reports had left Washington unsure the march was real.</li>
      </ol>
      <span class="note-approx">Ford positions are approximate, and both routes follow the period roads only roughly.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>Afternoon: Birmingham Hill and the retreat</h2>
    <div class="map-canvas" id="map-afternoon"></div>
    <figcaption>
      Sullivan, Stirling and Stephen swung north to face the threat and formed on the high ground by Birmingham Meeting House. Their line broke after heavy fighting, while Greene's division hurried up from Chadds Ford to cover the retreat.
      <ol>
        <li>About 4 p.m., the British attack downhill from Osborne's Hill. Sullivan's own division, still forming on the left, gives way first. Lafayette is wounded nearby.</li>
        <li>Greene covers about four miles in under an hour. Weedon's brigade holds a defile near Sandy Hollow until dark.</li>
        <li>Near sunset Knyphausen forces Chadds Ford and drives Wayne back. The army retreats through Dilworth toward Chester.</li>
      </ol>
      <span class="note-approx">Unit positions are schematic.</span>
    </figcaption>
  </figure>

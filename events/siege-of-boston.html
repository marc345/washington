  </header>

  <figure class="map">
    <h2>The siege lines, summer and autumn 1775</h2>
    <div class="map-canvas" id="map-lines"></div>
    <figcaption>
      American camps and earthworks ran in a ten-mile arc from Roxbury round to Winter Hill. They sealed the two land exits from British-held ground: Boston Neck and Charlestown Neck. The British held the Boston peninsula, Bunker Hill and the harbor.
      <ol>
        <li>Washington's headquarters in Cambridge, from mid-July 1775.</li>
        <li>Charlestown Neck: British works on Bunker Hill face the American forts on Prospect and Winter Hills.</li>
        <li>Boston Neck: British lines face the American works at Roxbury across the Neck.</li>
      </ol>
      <span class="note-approx">Shorelines follow a 1795 survey of Boston (earlier than the later landfill). The western edge of the Back Bay and the line of individual earthworks are approximate.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>Pressing closer: the northern front, August 1775 – January 1776</h2>
    <div class="map-canvas" id="map-cambridge"></div>
    <figcaption>
      Through the autumn and winter the Americans pushed their works forward toward Charlestown Neck and the Charles, partly to provoke the British and partly to bring guns within range.
      <ol>
        <li>August 26–27: Ploughed Hill fortified overnight, under British fire the next day.</li>
        <li>November 9: British troops land at Lechmere Point to seize cattle and are driven off.</li>
        <li>November 22: a battery goes up on Cobble Hill.</li>
        <li>December: Lechmere Point is fortified, bringing guns within reach of Boston.</li>
        <li>January 1, 1776: the new Continental colors are raised on Prospect Hill.</li>
        <li>January 8, 1776: a night raid burns houses near Charlestown Neck used by the British.</li>
      </ol>
      <span class="note-approx">Positions of individual works are approximate.</span>
    </figcaption>
  </figure>

<main>
  <header class="event-head">
    <h1>Battle of Long Island &amp; the East River retreat</h1>
    <p class="meta">August 22–30, 1776 · Brooklyn, Kings County, Long Island</p>
  </header>

  <figure class="map">
    <h2>August 22–26: the landing and the line of the heights</h2>
    <div class="map-canvas" id="map-positions"></div>
    <figcaption>
      Howe ferried about 15,000 men from Staten Island to Gravesend Bay on August 22; Hessian reinforcements brought the force to about 20,000 by the 25th. The Americans held a wooded ridge, the Heights of Guan, with guards at the passes, and a fortified inner line around Brooklyn. The Jamaica Pass, far out on the left, was watched by only a small mounted patrol.
      <ol>
        <li>Landing beaches between Denyse's Ferry and Gravesend.</li>
        <li>Brooklyn lines and forts, about 1½ miles long.</li>
      </ol>
      <span class="note-approx">The ridge passes, roads and outpost positions are approximate; roads follow period maps where known.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>August 26–27: the flank march and the battle</h2>
    <div class="map-canvas" id="map-battle"></div>
    <figcaption>
      While Grant and the Hessians held the Americans' attention in front, Howe led about 10,000 men on a night march east to the unguarded Jamaica Pass. By 9 a.m. the column was at Bedford, behind the American left, and two signal guns set off a general attack.
      <ol>
        <li>Around 2–3 a.m. the five-man American patrol at the pass is captured.</li>
        <li>Grant's night attack on the Gowanus Road drives in the pickets near the Red Lion; Stirling forms a line to meet him.</li>
        <li>At 9 a.m. the Hessians storm the Flatbush Pass. Sullivan's troops, hit front and rear, break; Sullivan is captured.</li>
        <li>Marylanders charge Cornwallis's troops at the Vechte–Cortelyou house (Old Stone House) so that others can wade the Gowanus Creek. Stirling is captured.</li>
      </ol>
      <span class="note-approx">Times and unit positions are approximate.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>August 29–30: the night crossing</h2>
    <div class="map-canvas" id="map-retreat"></div>
    <figcaption>
      With the British digging siege trenches toward Fort Putnam and a northeast wind keeping their warships out of the East River, Washington pulled the whole army back across to Manhattan in one night. Glover's and Hutchinson's Massachusetts regiments, mostly sailors and fishermen, rowed the boats from about 10 p.m. until after dawn, when fog hid the last crossings.
      <ol>
        <li>Mifflin's covering force holds the lines to the end, after briefly leaving too early by mistake.</li>
        <li>Brooklyn ferry: the main embarkation point. Washington is said to have crossed in one of the last boats.</li>
        <li>British approach trench, opened on the night of August 28.</li>
      </ol>
      <span class="note-approx">Boat routes are schematic; the exact landing places in Manhattan are not well recorded.</span>
    </figcaption>
  </figure>
</main>

    const c = P(p.coords);
    root.append('path').attr('d', 'M-7,-7 Q-2,0 -7,7 M7,-7 Q2,0 7,7')
      .attr('transform', `translate(${c[0]},${c[1]}) rotate(${p.angle || 0}) scale(${u})`)
      .attr('fill', 'none').attr('stroke', '#fffaf0').attr('stroke-width', 4.2).attr('stroke-linecap', 'round');
    root.append('path').attr('d', 'M-7,-7 Q-2,0 -7,7 M7,-7 Q2,0 7,7')
      .attr('transform', `translate(${c[0]},${c[1]}) rotate(${p.angle || 0}) scale(${u})`)

  });
}

  </header>

  <figure class="map">
    <h2>The night of March 4–5: fortifying the heights</h2>
    <div class="map-canvas" id="map-night"></div>
    <figcaption>
      Under cover of three nights of diversionary bombardment, General John Thomas led about 2,000 men and hundreds of ox-carts across Dorchester Neck after dark on March 4. By dawn, prefabricated works stood on the twin hills, with Knox's guns able to reach the town and the anchorage.
      <ol>
        <li>March 2–4: batteries at Lechmere Point, Cobble Hill and Lamb's Dam fire on Boston to cover the noise of the work.</li>
        <li>Bales of hay screen the road across the exposed Neck.</li>
        <li>Putnam waits at Cambridge with about 4,000 men and boats, ready to cross the Back Bay and attack Boston if Howe assaults the heights.</li>
        <li>March 5: Howe sends troops to Castle William for a counterattack. A violent storm that night stops it.</li>
      </ol>
      <span class="note-approx">The positions of the two works and of Putnam's planned crossing are approximate. Shorelines follow a 1795 survey of Boston.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>March 17: the British sail away</h2>
    <div class="map-canvas" id="map-evacuation"></div>
    <figcaption>
      Howe chose to leave rather than attack. Washington tightened the pressure by fortifying Nook's Hill, closer to the town, on the night of March 16. Next morning about 9,000 troops and over 1,000 Loyalists boarded the fleet, which waited in Nantasket Road for ten days before sailing for Halifax.
      <ol>
        <li>March 16–17: works go up on Nook's Hill, within cannon shot of the wharves.</li>
        <li>March 17: the garrison embarks at the town wharves, unopposed.</li>
        <li>American troops enter the town over Boston Neck the same day.</li>
        <li>The fleet anchors in Nantasket Road, blows up Castle William on its way out, and sails for Halifax on March 27.</li>
      </ol>
      <span class="note-approx">Ship positions are schematic. Shorelines near Boston follow a 1795 survey; the outer islands are shown with their modern outlines.</span>
    </figcaption>
  </figure>

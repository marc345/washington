    <h1>The hard winter at Morristown</h1>
    <p class="meta">December 1779 – June 1780 · Morristown, Jockey Hollow and Springfield, New Jersey</p>
  </header>

  <figure class="map">
    <h2>The Jockey Hollow encampment, winter 1779–80</h2>
    <div class="map-canvas" id="map-camp"></div>
    <figcaption>
      About 10,000 men in eleven brigades built some 1,200 log huts on the wooded slopes of Jockey Hollow, four to five miles south of town. Washington lived at the Ford house in Morristown. Deep snow and failed supplies brought the army close to starving in January.
      <ol>
        <li>Ford house, Washington's headquarters from December 1, 1779, with the Life Guard camped nearby.</li>
        <li>Knox's artillery park on the edge of town.</li>
        <li>Wick farm, quarters of St. Clair, commanding the Pennsylvania brigades.</li>
        <li>Grand Parade, used for daily inspections and punishments.</li>
        <li>The New Jersey brigade camped about two miles south, toward Basking Ridge.</li>
      </ol>
      <span class="note-approx">Brigade sites are approximate and grouped by state; several states had two brigades. Roads follow modern Jockey Hollow, Tempe Wick and Mount Kemble roads.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>Connecticut Farms and Springfield, June 7 and June 23, 1780</h2>
    <div class="map-canvas" id="map-springfield"></div>
    <figcaption>
      Twice in June a British and Hessian force under Knyphausen marched inland from Elizabethtown Point toward the gap in the hills that led to Morristown. Both times New Jersey Continentals and swarming militia stopped it at the Rahway River crossings around Springfield.
      <ol>
        <li>June 7: Knyphausen lands at Elizabethtown Point overnight and pushes through Connecticut Farms, which is burned. He is stopped short of Springfield and falls back.</li>
        <li>June 23: Angell's Rhode Islanders hold the bridge east of town before falling back to Shreve's regiment at the second bridge.</li>
        <li>June 23: the right column on the Vauxhall road is checked by Lee's dragoons and Ogden's regiment at the Vauxhall bridge.</li>
        <li>Greene, commanding, holds the Short Hills with Maxwell's and Stark's brigades. The British burn Springfield and withdraw to Staten Island that night.</li>
      </ol>
      <span class="note-approx">Positions are approximate. Newark Bay's modern shoreline is shown; the port areas were then salt marsh.</span>
    </figcaption>
  </figure>

    <h1>Defending New York</h1>
    <p class="meta">April – August 1776 · New York City, Brooklyn and the harbor</p>
  </header>

  <figure class="map">
    <h2>The works around the city and Brooklyn, summer 1776</h2>
    <div class="map-canvas" id="map-works"></div>
    <figcaption>
      Batteries ringed the tip of Manhattan, and barricades blocked the streets. Across the East River a line of forts sealed off Brooklyn Heights from Wallabout Bay to the Gowanus marshes, with outlying works on Governors Island and Red Hook.
      <ol>
        <li>Fort George and the Grand Battery at the tip of the island.</li>
        <li>The Brooklyn line: Fort Putnam, the Oblong Redoubt, Fort Greene and Fort Box.</li>
        <li>Fort Stirling on the Heights covered the city across the river.</li>
      </ol>
      <span class="note-approx">The 1776 shoreline follows the Ratzer maps and modern reconstructions; it and the positions of the smaller works are approximate.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>The British arrive, June 29 – August 18</h2>
    <div class="map-canvas" id="map-fleet"></div>
    <figcaption>
      Howe's fleet gathered inside Sandy Hook and landed the army on Staten Island in early July. On July 12 the <i>Phoenix</i> and <i>Rose</i> ran past the American batteries up the Hudson, showing that the forts could not close the river. By mid-August reinforcements from Charleston and Europe had brought the British force to about 32,000.
      <ol>
        <li>June 29: the first ships anchor off Sandy Hook. Troops land at the Watering Place on Staten Island on July 2–3.</li>
        <li>July 12: <i>Phoenix</i> and <i>Rose</i> run up to the Tappan Zee. In the city, several American guns burst while firing at them.</li>
        <li>August 16: American fire ships attack the two warships and burn a tender. The ships come back down on August 18.</li>
        <li>August 1 and 12: Clinton's troops from the south and the first Hessians arrive.</li>
      </ol>
      <span class="note-approx">Ship tracks and anchorages are schematic.</span>
    </figcaption>
  </figure>
</main>

function nyPasses(list) {
  return ({ root, P, u }) => list.forEach(p => {
    const c = P(p.coords);
    root.append('path').attr('d', 'M-7,-7 Q-2,0 -7,7 M7,-7 Q2,0 7,7')
      .attr('transform', `translate(${c[0]},${c[1]}) rotate(${p.angle || 0}) scale(${u})`)
      .attr('fill', 'none').attr('stroke', '#fffaf0').attr('stroke-width', 4.2).attr('stroke-linecap', 'round');
    root.append('path').attr('d', 'M-7,-7 Q-2,0 -7,7 M7,-7 Q2,0 7,7')
      .attr('transform', `translate(${c[0]},${c[1]}) rotate(${p.angle || 0}) scale(${u})`)
      .attr('fill', 'none').attr('stroke', '#5a3d1e').attr('stroke-width', 2).attr('stroke-linecap', 'round');
  });
}

    <h1>Lexington, Concord &amp; Bunker Hill</h1>
    <p class="meta">April 19 – June 17, 1775 · Middlesex County and Charlestown, Massachusetts</p>
  </header>

  <figure class="map">
    <h2>Night of April 18–19: the alarm and the march out</h2>
    <div class="map-canvas" id="map-march"></div>
    <figcaption>
      About 700 grenadiers and light infantry under Lt. Col. Francis Smith were rowed across the Back Bay and marched for Concord to seize militia stores. Riders had already gone out by two routes to raise the countryside.
      <ol>
        <li>About 10 p.m.: the troops embark at the foot of Boston Common and land at Lechmere Point, then wade the marshes to the road.</li>
        <li>Revere is rowed to Charlestown and rides by way of Medford. Dawes leaves over Boston Neck.</li>
        <li>About 1 a.m.: Revere and Dawes reach Lexington and ride on toward Concord. Revere is caught by a patrol in Lincoln, but Dr. Samuel Prescott gets through.</li>
        <li>About 5 a.m.: the advance guard meets Parker's militia company on Lexington Green. Eight militiamen are killed.</li>
        <li>About 8 a.m.: Smith's column enters Concord.</li>
      </ol>
      <span class="note-approx">The riders' routes and the capture site are approximate. Shorelines near Boston follow a 1795 survey.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>April 19: Concord and the running fight back to Charlestown</h2>
    <div class="map-canvas" id="map-retreat"></div>
    <figcaption>
      After a clash at the North Bridge, the column turned back about noon. Militia from dozens of towns fired on it from cover along the whole road. Lord Percy's relief brigade met the column east of Lexington, and the combined force fought its way through Menotomy to Charlestown Neck by dusk.
      <ol>
        <li>Mid-morning: militia drive the British guard off the North Bridge.</li>
        <li>About 12:30 p.m.: heavy firing begins at Meriam's Corner and goes on through the Bloody Angle in Lincoln and Parker's Revenge west of Lexington.</li>
        <li>About 2:30 p.m.: Percy's brigade, with two field guns, meets the exhausted column near Munroe Tavern.</li>
        <li>Late afternoon: the worst fighting of the day, house to house in Menotomy.</li>
        <li>About 7 p.m.: Percy turns off toward Charlestown, avoiding the Great Bridge, and reaches the safety of Charlestown Neck.</li>
      </ol>
      <span class="note-approx">Fighting sites are shown at their traditional locations. Militia attacks came from many directions and are not drawn individually.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>June 17: Breed's Hill and Bunker Hill</h2>
    <div class="map-canvas" id="map-bunker"></div>
    <figcaption>
      On the night of June 16–17 Col. William Prescott's men built a redoubt on Breed's Hill, closer to Boston than the Bunker Hill they had been sent to fortify. Next afternoon Howe landed at Moulton's Point and attacked. Two assaults were thrown back. The third, after the defenders ran short of powder, took the redoubt.
      <ol>
        <li>Light infantry attack along the Mystic beach and are cut down at Stark's stone wall.</li>
        <li>Grenadiers attack the rail fence held by Knowlton and the New Hampshire men.</li>
        <li>Pigot's wing attacks the redoubt. Charlestown is set on fire by shells from Copp's Hill and the ships.</li>
        <li>The final assault carries the redoubt. Dr. Joseph Warren is killed, and the Americans retreat over Bunker Hill and across the Neck under fire.</li>
      </ol>
      <span class="note-approx">The rail fence, breastwork and attack lines are schematic. The peninsula's shoreline follows a 1795 survey, before the Navy Yard and other fill.</span>
    </figcaption>
  </figure>

  <header class="event-head">
    <h1>Evacuation of New York &amp; the road home</h1>
    <p class="meta">November 25 – December 24, 1783 · New York City to Annapolis and Mount Vernon</p>
  </header>

  <figure class="map">
    <h2>Evacuation Day, November 25</h2>
    <div class="map-canvas" id="map-nyc"></div>
    <figcaption>
      Washington and Governor George Clinton waited at Harlem while the last British posts were given up. On November 25 they rode down the Post Road and the Bowery behind Knox's advance guard and entered the city as the British rowed out to their ships, which then lay in the bay and off Staten Island until early December.
      <span class="note-approx">Shorelines are drawn approximately as they were before later landfill (the 1776 reconstruction used on the other New York maps). The road line is approximate.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>Lower Manhattan, November 25 – December 4</h2>
    <div class="map-canvas" id="map-lower"></div>
    <figcaption>
      The procession halted at the Bull's Head Tavern on the Bowery until the British had left, then went on to a reception at Cape's Tavern on Broadway. At Fort George the Americans found the British flag nailed to a greased flagpole, and a sailor climbed it to put up the Stars and Stripes.
      <ol>
        <li>December 4: Washington takes leave of his officers at Fraunces Tavern.</li>
        <li>He walks to Whitehall and crosses by barge to Paulus Hook in New Jersey.</li>
      </ol>
      <span class="note-approx">Shorelines are an approximate reconstruction from 1760s–70s plans, before later landfill.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>To Annapolis and Mount Vernon, December 4–24</h2>
    <div class="map-canvas" id="map-journey"></div>
    <figcaption>
      Washington rode south through New Jersey to Philadelphia, where he stayed about a week to settle his wartime expense accounts, then went on through Wilmington and Baltimore to Annapolis, where Congress was sitting. At noon on December 23 he handed back his commission in the Maryland State House, and he reached Mount Vernon on Christmas Eve.
      <span class="note-approx">Overnight stops are approximate, and the route from Annapolis to Mount Vernon is not exactly known.</span>
    </figcaption>
  </figure>

  <header class="event-head">
    <h1>Arnold's treason at West Point</h1>
    <p class="meta">September 18–25, 1780 · Hudson Highlands and Westchester, New York</p>
  </header>

  <figure class="map">
    <h2>Washington's journey to Hartford and back</h2>
    <div class="map-canvas" id="map-ride"></div>
    <figcaption>
      Washington crossed King's Ferry on September 18, with Arnold riding along as far as Peekskill, and rode across Connecticut to meet Rochambeau and Admiral Ternay at Hartford on September 21–22. On the way home he took the upper road through Litchfield and Fishkill, so a messenger sent to meet him on the lower road through Danbury missed him.
      <ol>
        <li>The Hartford conference with the French commanders.</li>
        <li>Night of September 24 at Fishkill; Washington reaches the Robinson House the next morning.</li>
      </ol>
      <span class="note-approx">The route between the Hudson and Litchfield is approximate.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>The plot unravels, September 21–25</h2>
    <div class="map-canvas" id="map-plot"></div>
    <figcaption>
      André came ashore from the <i>Vulture</i> to meet Arnold at night. When American guns drove the ship downriver, he had to return to New York by land in civilian clothes, carrying papers on the West Point defenses in his boot.
      <ol>
        <li>Arnold and André meet on the shore below Long Clove, night of September 21–22, then go to Joshua Hett Smith's house.</li>
        <li>Guns on Teller's Point fire on the <i>Vulture</i>, September 22.</li>
        <li>André and Smith cross King's Ferry that evening and spend the night near Crompond. Smith leaves him at Pines Bridge on the 23rd.</li>
        <li>Three militiamen stop André just north of Tarrytown, about 9 a.m. on September 23, and find the papers.</li>
        <li>On the 25th, warned at breakfast that André has been taken, Arnold flees by barge down the river to the <i>Vulture</i>.</li>
      </ol>
      <span class="note-approx">André's route through the neutral ground and the meeting place are approximate. Modern reservoirs are omitted.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>West Point and the Robinson House</h2>
    <div class="map-canvas" id="map-westpoint"></div>
    <figcaption>
      West Point's forts and the Great Chain across the river's sharp bend were what Arnold offered to hand over. He kept his headquarters across the river at Beverley Robinson's house, where Washington arrived on the morning of September 25, shortly after Arnold had gone.
      <ol>
        <li>Arnold leaves the house and goes down to his barge, about 10 a.m.</li>
        <li>Washington crosses to West Point, finds that Arnold has not been there, and returns in the afternoon, when the captured papers reach him.</li>
      </ol>
      <span class="note-approx">Fort and redoubt positions are approximate; only the main works are shown.</span>
    </figcaption>
  </figure>
</main>

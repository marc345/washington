<main>
  <header class="event-head">
    <h1>Saratoga campaign</h1>
    <p class="meta">June – October 1777 · Lake Champlain, the upper Hudson and the Mohawk valley, New York</p>
  </header>

  <figure class="map">
    <h2>The British plan: three converging thrusts on Albany</h2>
    <div class="map-canvas" id="map-campaign"></div>
    <figcaption>
      Burgoyne came south from Canada by Lake Champlain, St. Leger was to sweep down the Mohawk valley, and help was expected from New York up the Hudson. Only Burgoyne got anywhere near Albany.
      <ol>
        <li>Jul 5–6: British guns on Mount Defiance force the Americans to abandon Ticonderoga in the night.</li>
        <li>Jul 7: the American rear guard fights a delaying action at Hubbardton.</li>
        <li>Jul 6–30: Burgoyne marches overland by Skenesborough and Fort Anne. Schuyler's men fell trees and wreck bridges, and it takes him over three weeks to reach Fort Edward.</li>
        <li>Aug 16: a German foraging force sent toward Bennington is destroyed by Stark's militia.</li>
        <li>Aug 3–22: St. Leger besieges Fort Stanwix. Herkimer's relief column is ambushed at Oriskany on Aug 6. St. Leger withdraws when he hears that Arnold is coming.</li>
        <li>Sep 13–15: Burgoyne crosses to the west bank of the Hudson at Saratoga and heads for Albany.</li>
        <li>Oct 6–16: Clinton takes the Highlands forts below the map. An advance force burns Kingston and then turns back.</li>
      </ol>
      <span class="note-approx">Routes are drawn at campaign scale and are approximate in detail.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>September 19: Freeman's Farm</h2>
    <div class="map-canvas" id="map-freeman"></div>
    <figcaption>
      Burgoyne advanced from his camp on the river in three columns. Morgan's riflemen met the center column in the clearing at Freeman's farm. The fight there went back and forth all afternoon as Arnold fed in more brigades from the Bemis Heights lines.
      <ol>
        <li>Morgan's men cut down the British advance guard at the farm, about 1 p.m.</li>
        <li>The farm clearing changes hands several times. The 62nd Regiment is nearly destroyed.</li>
        <li>Late in the day Riedesel's Germans arrive from the river road on the American right, and the Americans withdraw at dusk. The British hold the field but lose about 600 men, twice the American loss.</li>
      </ol>
      <span class="note-approx">Column routes and unit positions are schematic. The American lines are shown as they were finished after September 19.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>October 7: Bemis Heights</h2>
    <div class="map-canvas" id="map-bemis"></div>
    <figcaption>
      Burgoyne sent about 1,500 men and ten guns out to the Barber wheatfield to probe the American left. The Americans attacked both flanks at once and drove them back into the fortified camp. That evening Burgoyne's position was no longer tenable.
      <ol>
        <li>Poor's brigade strikes the grenadiers on the British left while Morgan and Dearborn turn the right. Fraser is mortally wounded rallying the line.</li>
        <li>Arnold, who had no command, leads an attack on the Balcarres redoubt, which is beaten off.</li>
        <li>Learned's brigade and Morgan storm the Breymann redoubt from the rear. Breymann is killed and Arnold is shot in the leg.</li>
      </ol>
      <span class="note-approx">Redoubt sites follow the national park's markers. Unit positions are schematic.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>October 8–17: retreat and surrender at Saratoga</h2>
    <div class="map-canvas" id="map-surrender"></div>
    <figcaption>
      Burgoyne fell back up the river in heavy rain, leaving his wounded behind. At Saratoga he dug in on the heights north of Fish Creek, where Gates's growing army closed in on three sides and militia held the far bank and the road north. The army laid down its arms on October 17.
      <ol>
        <li>Oct 8–9: the night retreat by the river road.</li>
        <li>Oct 10: Burgoyne's fortified camp above Fish Creek. Schuyler's house and mills are burned.</li>
        <li>Militia across the Hudson and Stark's men at the crossings to the north cut off any escape.</li>
        <li>Oct 17: some 5,900 men march out and ground their arms by the old fort on the river flats.</li>
      </ol>
      <span class="note-approx">The extent of the British camp and the American positions are approximate.</span>
    </figcaption>
  </figure>
</main>

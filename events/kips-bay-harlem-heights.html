<main>
  <header class="event-head">
    <h1>Kip's Bay &amp; Harlem Heights</h1>
    <p class="meta">September 15–16, 1776 · Manhattan Island</p>
  </header>

  <figure class="map">
    <h2>September 15: the landing at Kip's Bay</h2>
    <div class="map-canvas" id="map-landing"></div>
    <figcaption>
      After an hour's bombardment from five warships, about 4,000 British and Hessian troops rowed across from the mouth of Newtown Creek and landed at Kip's Bay. The militia in the shore trenches fled. The landing cut Manhattan in two, but Howe halted at Inclenberg, and Putnam's division escaped from the city up the west side.
      <ol>
        <li>Landing, late morning. Washington rides down from Harlem and fails to rally the retreating brigades near the Post Road.</li>
        <li>Howe halts at Robert Murray's house on Inclenberg (Murray Hill) to wait for the second wave.</li>
        <li>Putnam's men take back roads near the Hudson to Harlem Heights, guided by his aide Aaron Burr.</li>
        <li>By evening the British hold a line across the island from Horn's Hook to Bloomingdale; a brigade enters the city.</li>
      </ol>
      <span class="note-approx">Road lines, Putnam's route and the British evening line are approximate.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>September 16: the fight at Harlem Heights</h2>
    <div class="map-canvas" id="map-battle"></div>
    <figcaption>
      A dawn scouting party under Knowlton ran into British light infantry near the Jones farm and fell back across the Hollow Way, while a British bugler sounded a fox-hunting call. Washington answered with a feint from the front and a flanking party sent around the British right. Reinforced, the Americans drove the British back across a buckwheat field before Washington called them off in the early afternoon.
      <ol>
        <li>Dawn skirmish near the Jones farm; Knowlton's rangers withdraw.</li>
        <li>Feint into the Hollow Way draws the British down from the heights.</li>
        <li>Knowlton and Leitch strike the British flank too soon; both are mortally wounded.</li>
        <li>Fighting in the buckwheat field; the British fall back as Hessian and Highland reinforcements arrive.</li>
      </ol>
      <span class="note-approx">The American lines are schematic; all positions are approximate.</span>
    </figcaption>
  </figure>

// On narrow screens symbols and text grow relative to the map, so items can carry phone-only
// tweaks: `ph: {...}` is merged in, and `phone: false` drops the item.
const NY_PHONE = window.matchMedia('(max-width: 640px)').matches;
function nyRender(sel, cfg) {
  ['towns', 'labels', 'units', 'battles', 'ships', 'moves', 'callouts', 'roads'].forEach(k => {
    if (!cfg[k]) return;
    cfg[k] = cfg[k].filter(it => !(NY_PHONE && it.phone === false)).map(it => NY_PHONE && it.ph ? Object.assign({}, it, it.ph) : it);
  });
  const w = cfg.water || {};
  // river centrelines drawn inside the big water polygons, and modern conduits
  const rv = cfg.rivers || {};
  if (!rv.only) cfg.rivers = Object.assign({}, rv, { hide: ['Hudson Riv', 'Hudson River Phl', 'East Riv', 'Harlem Riv', 'Jersey City Aqueduct', 'Sewer R O W'].concat(rv.hide || []) });
  cfg.water = Object.assign({}, w, { hide: NY_HIDE.concat(w.hide || []), hideIn: [[-73.676, 40.964, -73.664, 40.978]].concat(w.hideIn || []) });
  return NY1776.then(c => {
    const own = cfg.corrections || {};
    cfg.corrections = { water: c.water.concat(own.water || []), land: c.land.concat(own.land || []) };
    const marsh = c.marsh.concat(cfg.marsh || []);
    const user = cfg.after;
    cfg.legendExtra = (cfg.noMarsh ? [] : [{ svg: '<svg viewBox="0 0 26 12"><rect x="1" y="1" width="24" height="10" fill="#d3dcc4"/><path d="M4,10 l1.5,-5 M7,10 v-6 M10,10 l-1.5,-5 M16,10 l1.5,-5 M19,10 v-6 M22,10 l-1.5,-5" stroke="#5e8466" stroke-width="1"/></svg>', text: 'Salt marsh' }]).concat(cfg.legendExtra || []);
    cfg.after = ctx => {
      const { root, defs, proj, fs } = ctx;
      // all water shapes merged into one group (kept together so the marsh mask can reuse them)
      const ws = root.selectAll('path.hm-water').nodes();
      const wd = ws.map(n => n.getAttribute('d'));
      if (ws.length) {
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        ws[0].parentNode.insertBefore(g, ws[0]);
        const G = d3.select(g);
        ws.forEach(n => G.append('path').attr('d', n.getAttribute('d')).attr('fill', '#bccfd0'));
        ws.forEach(n => n.remove());
      }
      if (!cfg.noMarsh) {
        const id = 'marsh' + Math.random().toString(36).slice(2, 7), s = fs(8);
        const pat = defs.append('pattern').attr('id', id).attr('patternUnits', 'userSpaceOnUse').attr('width', s).attr('height', s);
        pat.append('rect').attr('width', s).attr('height', s).attr('fill', '#d3dcc4').attr('fill-opacity', 0.75);
        pat.append('path').attr('d', `M${s*.2},${s*.55} l${s*.08},-${s*.3} M${s*.32},${s*.55} v-${s*.36} M${s*.44},${s*.55} l-${s*.08},-${s*.3} M${s*.7},${s*.95} l${s*.08},-${s*.3} M${s*.82},${s*.95} v-${s*.36} M${s*.94},${s*.95} l-${s*.08},-${s*.3}`)
          .attr('stroke', '#5e8466').attr('stroke-width', fs(0.7)).attr('fill', 'none');
        const mg = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        // marsh only on land: masked by the land shape minus every water shape (period corrections included)
        const mid = id + 'm';
        const mask = defs.append('mask').attr('id', mid).attr('maskUnits', 'userSpaceOnUse');
        mask.append('path').attr('d', root.select('path.hm-land').attr('d')).attr('fill', '#fff');
        wd.forEach(d => mask.append('path').attr('d', d).attr('fill', '#000'));
        mg.setAttribute('mask', `url(#${mid})`);
        const rv = root.select('g.hm-rivers').node();
        rv.parentNode.insertBefore(mg, rv);
        const path = d3.geoPath(proj);
        marsh.forEach(r => d3.select(mg).append('path').attr('d', path({ type: 'Polygon', coordinates: [r.concat([r[0]])] })).attr('fill', `url(#${id})`));
      }
      if (user) user(ctx);
    };
    return HMap.render(sel, cfg);
  });
}
// passes through a ridge, drawn as )( marks: after-hook factory + legend entry
const NY_PASS_LEGEND = { svg: '<svg viewBox="-13 -7 26 14"><path d="M-7,-6 Q-2,0 -7,6 M7,-6 Q2,0 7,6" fill="none" stroke="#5a3d1e" stroke-width="1.8"/></svg>', text: 'Pass through the heights' };
function nyPasses(list) {
  return ({ root, P, u }) => list.forEach(p => {
    const c = P(p.coords);
    root.append('path').attr('d', 'M-7,-7 Q-2,0 -7,7 M7,-7 Q2,0 7,7')
      .attr('transform', `translate(${c[0]},${c[1]}) rotate(${p.angle || 0}) scale(${u})`)
      .attr('fill', 'none').attr('stroke', '#fffaf0').attr('stroke-width', 4.2).attr('stroke-linecap', 'round');
    root.append('path').attr('d', 'M-7,-7 Q-2,0 -7,7 M7,-7 Q2,0 7,7')
      .attr('transform', `translate(${c[0]},${c[1]}) rotate(${p.angle || 0}) scale(${u})`)
      .attr('fill', 'none').attr('stroke', '#5a3d1e').attr('stroke-width', 2).attr('stroke-linecap', 'round');
  });
}

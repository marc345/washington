    <p class="meta">December 19, 1777 – June 19, 1778 · Valley Forge, Pennsylvania</p>
  </header>

  <figure class="map">
    <h2>Watching Philadelphia: the winter of 1777–78</h2>
    <div class="map-canvas" id="map-region"></div>
    <figcaption>
      Valley Forge lay about 18 miles from Philadelphia: close enough to watch Howe and shield the country to the west, far enough to make a surprise attack difficult. The British held the city behind a line of redoubts while patrols and foragers from both sides contested the ground between.
      <ol>
        <li>May 1: British raiders surprise Lacey's Pennsylvania militia at the Crooked Billet tavern.</li>
        <li>May 20: Lafayette, sent forward to Barren Hill with about 2,200 men, nearly has his retreat cut off by converging British columns. He escapes over Matson's Ford.</li>
        <li>Jun 18: Clinton, who has replaced Howe, evacuates Philadelphia across the Delaware toward New York. Washington leaves Valley Forge the next day in pursuit.</li>
      </ol>
      <span class="note-approx">The British redoubt line and all routes are approximate.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>The encampment</h2>
    <div class="map-canvas" id="map-camp"></div>
    <figcaption>
      The army built some 1,500 log huts in brigade rows on a plateau bounded by the Schuylkill and Valley Creek. An outer line of earthworks faced Philadelphia; an inner line along the slope of Mount Joy formed a fallback. Steuben drilled the troops on the open ground between the lines from March onward.
      <span class="note-approx">Lines and brigade areas follow the National Park Service's reconstruction of the camp and are simplified.</span>
    </figcaption>
  </figure>
</main>

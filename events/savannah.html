<main>
  <header class="event-head">
    <h1>Savannah</h1>
    <p class="meta">December 29, 1778 and September 12 – October 9, 1779 · Savannah, Georgia</p>
  </header>

  <figure class="map">
    <h2>The British take Savannah, December 29, 1778</h2>
    <div class="map-canvas" id="map-1778"></div>
    <figcaption>
      Campbell's 3,100 men landed below the town and found Robert Howe's 850 Americans drawn up across the road with swamp on both flanks. An enslaved man, Quamino Dolly, led a British force along a hidden path through the swamp around Howe's right.
      <ol>
        <li>Landing at Girardeau's plantation on Brewton Hill, morning of December 29.</li>
        <li>Baird's light infantry and the New York Volunteers come out of the swamp behind the American right, while Campbell attacks in front.</li>
        <li>The Americans break and run through and around the town. Many are taken at Musgrove Creek; others drown in Yamacraw Creek or escape upriver to South Carolina.</li>
      </ol>
      <span class="note-approx">The American line, the swamp path and the town's extent are approximate. The riverbank shown is modern.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>The allies close in, September 1779</h2>
    <div class="map-canvas" id="map-region"></div>
    <figcaption>
      D'Estaing's French troops came ashore south of the city and Lincoln's Americans crossed the Savannah from South Carolina. Prevost asked for a truce to consider surrender, and used it to bring in Maitland's 800 men from Beaufort by a back route through the coastal creeks.
      <ol>
        <li>French landing at Beaulieu, September 12–16.</li>
        <li>Lincoln crosses at Zubly's Ferry and joins d'Estaing before Savannah on September 16.</li>
        <li>Maitland's boats slip past the French through Skull Creek and Wall's Cut, reaching Savannah September 16–17.</li>
      </ol>
      <span class="note-approx">Routes are approximate. Marshes are shown as land.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>The assault, dawn of October 9, 1779</h2>
    <div class="map-canvas" id="map-assault"></div>
    <figcaption>
      After a five-day bombardment failed to break the defenses, d'Estaing stormed the British right at the Spring Hill redoubt. The columns came under fire in the open and in the swampy ground west of the line, and fell back in about an hour.
      <ol>
        <li>French and American columns, with Laurens's Continentals and Pulaski's cavalry, strike Spring Hill. Pulaski is mortally wounded.</li>
        <li>Dillon's column loses its way in the swamp and is caught in the open.</li>
        <li>Huger's feint against the British left is easily turned back.</li>
      </ol>
      <span class="note-approx">The line of the British works, the allied trenches and the column routes are schematic.</span>
    </figcaption>
  </figure>

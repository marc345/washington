  <header class="event-head">
    <h1>Retreat across New Jersey</h1>
    <p class="meta">November 20 – December 20, 1776 · New Jersey, from the Hudson to the Delaware</p>
  </header>

  <figure class="map">
    <h2>Fort Lee to Newark, November 20–28</h2>
    <div class="map-canvas" id="map-hackensack"></div>
    <figcaption>
      Cornwallis crossed the Hudson above Fort Lee before dawn on November 20. Its garrison got away westward, but most of its guns and stores were lost. Washington took the army across the Hackensack at New Bridge and the Passaic at Acquackanonk, then down the Passaic to Newark.
      <ol>
        <li>About 4,000 British and Hessian troops climb the Palisades from the landing below Closter.</li>
        <li>New Bridge, the nearest crossing of the Hackensack. The army gets over just ahead of the British.</li>
        <li>The Americans cross the Passaic at Acquackanonk, November 21, and break up the bridge behind them.</li>
        <li>The army rests at Newark until November 28, then leaves as the British march in from the north.</li>
      </ol>
      <span class="note-approx">Road lines are approximate. Manhattan's shoreline follows a 1776 reconstruction; the extent of the Hackensack meadows is approximate.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>Newark to the Delaware, November 28 – December 8</h2>
    <div class="map-canvas" id="map-route"></div>
    <figcaption>
      The army followed the post road to New Brunswick, then on through Princeton to Trenton, shrinking as enlistments ran out. Cornwallis followed close behind, entering Newark on November 28, New Brunswick on December 1 and Trenton on December 8.
      <ol>
        <li>Rear-guard skirmish at the Raritan bridge as the army leaves New Brunswick, December 1.</li>
        <li>Cornwallis halts at New Brunswick until Howe joins him on December 6.</li>
        <li>Stirling's brigade holds Princeton as a rear guard until December 7.</li>
        <li>Washington gathers every boat along the river and crosses into Pennsylvania on December 7–8, just as the British reach Trenton.</li>
      </ol>
      <span class="note-approx">The post road is drawn along the line of modern Route 27 and US 206.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>Lee's march and capture, December 2–20</h2>
    <div class="map-canvas" id="map-lee"></div>
    <figcaption>
      Charles Lee was slow to bring his division across from New York, and while it camped at Vealtown he spent the night at a tavern in Basking Ridge, about three miles away. A British cavalry patrol captured him there on the morning of December 13. Sullivan then led his troops by a northern route to join Washington on the Pennsylvania bank.
      <ol>
        <li>Lee's division, coming from North Castle, crosses the Hudson at King's Ferry, December 2–4.</li>
        <li>White's tavern, Basking Ridge: Lee is taken by about 25 dragoons under Harcourt, with Banastre Tarleton among them.</li>
        <li>Sullivan crosses the Delaware near Easton and comes down the Pennsylvania bank, reaching the main army on December 20.</li>
      </ol>
      <span class="note-approx">Lee's route through the Highlands, the patrol's route and Sullivan's march are approximate. The shaded zone shows the stretch of river the Americans guarded, not exact camps.</span>
    </figcaption>
  </figure>

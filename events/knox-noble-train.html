<main>
  <header class="event-head">
    <h1>Knox's "noble train" of artillery</h1>
    <p class="meta">December 1775 – January 1776 · Fort Ticonderoga to Cambridge</p>
  </header>

  <figure class="map">
    <h2>Some 300 miles by boat, sled and ox team</h2>
    <div class="map-canvas" id="map-route"></div>
    <figcaption>
      Henry Knox chose 59 cannon, mortars and howitzers at Ticonderoga, about 60 tons in all. He moved them by boat down Lake George, then on sleds over snow and frozen rivers, across the Berkshires to the army outside Boston.
      <ol>
        <li>From December 6: the guns go by boat down Lake George to Fort George. One scow sinks near Sabbath Day Point and is raised.</li>
        <li>Late December to January 9: the sleds cross the Hudson and the Mohawk on the ice near Albany. One gun breaks through and is hauled out.</li>
        <li>Mid-January: the climb over the Berkshires by Great Barrington, Monterey, Otis and Blandford, the hardest stretch.</li>
        <li>By January 25: the train reaches Framingham, where the guns are left before going to the siege lines.</li>
      </ol>
      <span class="note-approx">The route follows the towns marked on the Henry Knox Trail; the exact roads between them are approximate (dotted).</span>
    </figcaption>
  </figure>
</main>

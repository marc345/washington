  <header class="event-head">
    <h1>Newport</h1>
    <p class="meta">July 29 – August 30, 1778 · Narragansett Bay and Aquidneck Island, Rhode Island</p>
  </header>

  <figure class="map">
    <h2>The allied plan: French fleet in the bay, Sullivan on the island</h2>
    <div class="map-canvas" id="map-bay"></div>
    <figcaption>
      The British held Newport and all of Aquidneck Island with about 6,700 men. D'Estaing's fleet was to force its way into the bay and land French troops while Sullivan crossed onto the island from the east, so that Newport would be attacked from two sides.
      <ol>
        <li>Jul 29: the French fleet arrives off Point Judith. From Jul 30 to Aug 5 French ships push into the Sakonnet and western passages, and the British burn or scuttle their own warships to keep them from being captured.</li>
        <li>Aug 8: d'Estaing runs past the Newport batteries into the bay. The British pull back into their lines around the town.</li>
        <li>Aug 9: Sullivan crosses from Tiverton at Howland's Ferry. The same day Howe's relief fleet appears off Point Judith.</li>
        <li>Aug 10: d'Estaing sails out to fight Howe. A great gale on Aug 11–12 scatters and damages both fleets before they can engage.</li>
        <li>Aug 20–22: the French return only to announce that they are leaving for repairs in Boston, taking their troops with them.</li>
      </ol>
      <span class="note-approx">Fleet tracks are schematic.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>August 15–28: the siege lines before Newport</h2>
    <div class="map-canvas" id="map-siege"></div>
    <figcaption>
      Sullivan's army, about 10,000 men and largely New England militia, dug in on Honeyman's Hill opposite the British works and began to bombard them. Without the French fleet and troops, an assault was out of the question, and thousands of militia went home.
      <ol>
        <li>The British outer line, from Easton's Pond over Green End and Tonomy Hill to the harbor.</li>
        <li>American batteries and approach trenches on Honeyman's Hill.</li>
        <li>Night of Aug 28: Sullivan withdraws north to the fortified line on Butts Hill.</li>
      </ol>
      <span class="note-approx">The line traces are approximate. Several ponds here are modern reservoirs and are not shown.</span>
    </figcaption>
  </figure>

  <figure class="map">
    <h2>August 29: the Battle of Rhode Island</h2>
    <div class="map-canvas" id="map-battle"></div>
    <figcaption>
      Pigot followed the retreat up both island roads. The American rear guards fell back to the Butts Hill line. The heaviest fighting came on the American right, at the foot of the hill, where Greene's wing beat back repeated Hessian attacks.
      <ol>
        <li>Smith's British column comes up the East Road and pushes Livingston's rear guard off Quaker Hill.</li>
        <li>Lossberg's Hessians drive Laurens's light troops back along the West Road from Turkey Hill.</li>
        <li>Greene's wing, including the 1st Rhode Island Regiment with its many Black and Native American soldiers, holds the valley below Butts Hill. British frigates fire into the American flank.</li>
        <li>Night of Aug 30: the army crosses safely to Tiverton and Bristol. Clinton arrives with 4,000 reinforcements the next day.</li>
      </ol>
      <span class="note-approx">Road lines and unit positions are approximate.</span>
    </figcaption>
  </figure>
